services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-finance-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: telegram-finance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: telegram_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: